<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jリーグ欠場・復帰情報台帳</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#3b2d23;background:#fff8f0}body{margin:0}header{background:#9a430f;color:white;padding:22px 4vw}h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#ffe2c2}nav{display:flex;flex-wrap:wrap;gap:7px;background:white;padding:12px 4vw;border-bottom:1px solid #ead6c1}button{cursor:pointer;border:1px solid #b98762;border-radius:6px;background:white;color:#7b390f;padding:7px 11px;font:inherit}button.primary{background:#ba5a16;color:white;border-color:#ba5a16}button:hover{filter:brightness(.94)}main{max-width:1250px;margin:22px auto;padding:0 16px}.panel{background:white;border:1px solid #ead9c7;border-radius:9px;padding:18px;margin-bottom:16px;box-shadow:0 2px 9px #6b3b1610}h2{margin:0 0 14px;font-size:20px}h3{margin:18px 0 8px}.muted{color:#75695d}.warn{color:#a35116}.bad{color:#a32121}.ok{color:#8b480e}.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:#fff0dd;font-size:12px}input,select,textarea{font:inherit;border:1px solid #c8ad91;border-radius:5px;padding:6px;max-width:100%;box-sizing:border-box}input[type=text],input[type=date]{min-width:140px}textarea{width:100%;min-height:65px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{border:1px solid #ebdac7;padding:12px;border-radius:7px;background:#fffdf9}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #f0e3d5;padding:8px;vertical-align:top}th{white-space:nowrap;background:#fff4e8}a{color:#a4490d}small{color:#75695d}.excerpt{white-space:pre-wrap;max-height:130px;overflow:auto;background:#fff7ec;padding:8px;border-radius:5px}details{margin:10px 0}summary{cursor:pointer;font-weight:600}.status{padding:8px 12px;min-height:20px}label{display:inline-flex;gap:5px;align-items:center}.stack{display:grid;gap:7px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.sheet-scroll{max-height:min(70vh,720px);overflow:auto;overscroll-behavior:contain}.sheet-scroll table{border-collapse:separate;border-spacing:0;min-width:780px}.sheet-scroll th{position:sticky;top:0;z-index:2;background:#fff4e8;box-shadow:0 1px 0 #d9c5b2}.cell-note{max-width:34rem;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.sort-button{border:0;background:transparent;padding:0;color:inherit;font-weight:700;text-align:left;white-space:nowrap}.sort-button:hover{text-decoration:underline}.sort-mark{display:inline-block;min-width:1em;color:#8b480e}
</style>
<header><h1>Jリーグ欠場・復帰情報台帳</h1><p>ローカル試作 · 台帳の状態と予想への反映は別です</p></header>
<nav id="nav"></nav><div id="status" class="status" aria-live="polite"></div><main id="app"></main>
<script>
let state={}, page='list', selected=null, preview=null, suspensionReview=null, listSort={key:'team',dir:1};const $=s=>document.querySelector(s);const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const reasonLabel=x=>({'injury':'負傷','card':'出場停止','illness':'病気','病気':'病気'})[x]||x||'不明';const coverageLabel=x=>({'verified-sample':'過去に一部の記事で取得を確認','partial':'個別記事のみ取得確認'})[x]||x||'未検証';const val=id=>$('#'+id)?.value||'';
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const t=r.headers.get('content-type')||'';const v=t.includes('json')?await r.json():await r.blob();if(!r.ok)throw Error(v.error||'通信失敗');return v}
function msg(s,bad=false){$('#status').textContent=s;$('#status').className='status '+(bad?'bad':'ok')}
async function refresh(){state=await api('state');render()}
async function act(path,data,success='保存しました'){try{msg('処理中…');let x=await api(path,data);msg(x.error||success,!!x.error);await refresh();return x}catch(err){msg(err.message,true)}}
const tabs=[['list','離脱中一覧'],['pending','確認待ち'],['suspensions','出場停止'],['detail','案件詳細'],['guide','負傷の参考目安'],['rosterPage','選手名簿'],['search','後追い検索'],['manual','手動経過'],['sources','収集状況'],['operations','定期収集管理'],['csv','CSV出力'],['migration','移行・保存']];
function render(){ $('#nav').innerHTML=tabs.map(([id,label])=>`<button class="${page===id?'primary':''}" onclick="page='${id}';render()">${label}</button>`).join('');$('#app').innerHTML=({list,pending,suspensions,detail,guide,rosterPage,search,manual,sources,operations,csv,migration}[page])() }
function suspensions(){let r=suspensionReview;return `<section class="panel"><h2>出場停止の登録</h2><p class="muted">Jリーグデータサイトの最新の出場停止のお知らせからJ1・J2選手を取得します。既存案件と同じ停止は追加せず、新しい情報は確認待ちへ保存します。</p><button class="primary" onclick="collectSuspensions()">最新の出場停止を取得</button></section><section class="panel"><h2>出場停止の消化確認</h2><p class="muted">Jリーグデータサイトの公式試合結果と、未終了の出場停止案件を照合します。スコアと公式記録へのリンクがある試合だけ候補にします。試合予定、照合不能、複数試合停止は消化済みにしません。</p><button class="primary" onclick="checkSuspensions()">公式試合結果を照合</button>${r?`<p>照合日時 ${e(r.checked_at)} / 消化候補 ${r.candidates.length}件 / 未確定 ${r.unresolved.length}件 / 取得失敗 ${r.errors.length}件</p>${r.errors.map(x=>`<p class="bad">取得失敗: ${e(x.url)} ${e(x.error)}</p>`).join('')}<h3>消化候補</h3>${r.candidates.map(x=>`<div class="card"><strong>#${x.case_id} ${e(x.team)} ${e(x.player)}</strong> · ${e(x.match.date)} ${e(x.match.league)} ${e(x.match.round)} ${e(x.match.home)} ${e(x.match.score)} ${e(x.match.away)}<br><a href="${e(x.match.result_url)}" target="_blank" rel="noopener">公式試合記録</a> <button onclick="reviewSuspension(${x.case_id})">案件で確認する</button></div>`).join('')||'<p>ありません</p>'}<h3>未確定</h3>${r.unresolved.map(x=>`<p>#${x.case_id} ${e(x.reason)}${x.match?`：${e(x.match.date)} ${e(x.match.home)} ${e(x.match.score)} ${e(x.match.away)}`:''}</p>`).join('')||'<p>ありません</p>'}`:'<p>照合はまだ実行していません。</p>'}</section>`}
async function collectSuspensions(){try{msg('最新の出場停止を取得中…');let r=await api('suspension/collect',{});await refresh();msg(`${r.published_at}掲載分: J1・J2選手 ${r.listed_players}件、新しい確認待ち ${r.created}件、既存案件 ${r.already_in_cases}件、既存候補 ${r.already_candidates}件`);if(r.created){page='pending';render()}}catch(err){msg(err.message,true)}}
async function checkSuspensions(){try{msg('公式試合結果を照合中…');suspensionReview=await api('suspension/check',{});render();msg('照合結果を表示しました')}catch(err){msg(err.message,true)}}
function reviewSuspension(id){let x=suspensionReview?.candidates.find(v=>v.case_id===id);if(!x)return;selected=id;page='detail';render();$('#effective').value=x.match.date;$('#fixture').value=`${x.match.league} ${x.match.round} ${x.match.home}対${x.match.away}`;$('#why').value=x.match.result_url;msg('公式試合記録を開き、対象試合と処分消化を確認してからチェックしてください')}
function sortHeader(key,label){let active=listSort.key===key,mark=active?(listSort.dir===1?'▲':'▼'):'↕';return `<th data-sort="${key}" aria-sort="${active?(listSort.dir===1?'ascending':'descending'):'none'}"><button class="sort-button" type="button" onclick="setListSort('${key}')" title="${e(label)}で並べ替え">${e(label)} <span class="sort-mark">${mark}</span></button></th>`}
function setListSort(key){listSort=listSort.key===key?{key,dir:-listSort.dir}:{key,dir:1};document.querySelectorAll('#listtable th[data-sort]').forEach(th=>{let active=th.dataset.sort===listSort.key;th.setAttribute('aria-sort',active?(listSort.dir===1?'ascending':'descending'):'none');th.querySelector('.sort-mark').textContent=active?(listSort.dir===1?'▲':'▼'):'↕'});filterList()}
const jaCollator=new Intl.Collator('ja',{numeric:true,sensitivity:'base'});
function dateNumber(s){let m=String(s||'').match(/^(\d{2})\/(\d{2})\/(\d{2})$/);if(m)return (2000+Number(m[1]))*10000+Number(m[2])*100+Number(m[3]);m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?Number(m[1])*10000+Number(m[2])*100+Number(m[3]):null}
function sortValue(x,key){switch(key){case 'team':return x.team;case 'player':return x.player;case 'reason':return reasonLabel(x.absence_type);case 'description':return x.diagnosis||x.note;case 'start':return dateNumber(x.start_date);case 'return':return dateNumber(x.expected_return_date);case 'latest':return state.evidence.filter(v=>v.case_id===x.id).at(-1)?.created_at||null;case 'pending':return state.candidates.filter(v=>v.state==='pending'&&v.case_id===x.id).length;default:return ''}}
function compareCases(a,b){let va=sortValue(a,listSort.key),vb=sortValue(b,listSort.key),missing=v=>v===null||v===undefined||v==='';if(missing(va)||missing(vb)){if(missing(va)&&missing(vb))return a.id-b.id;return missing(va)?1:-1}let n=typeof va==='number'&&typeof vb==='number'?va-vb:jaCollator.compare(String(va),String(vb));return n?listSort.dir*n:jaCollator.compare(a.team,b.team)||jaCollator.compare(a.player,b.player)||a.id-b.id}
function list(){let cases=state.cases.filter(x=>x.status==='open'),clubs=[...new Set(cases.map(x=>x.team))].sort(jaCollator.compare);setTimeout(filterList,0);let headings=[['team','クラブ'],['player','選手'],['reason','理由'],['description','元Excelの記載／案件の診断'],['start','開始日'],['return','CSV用の復帰見込み日'],['latest','最新経過'],['pending','確認待ち']];return `<section class="panel"><h2>離脱中一覧</h2><p class="muted">この日付は復帰を確認した日ではありません。元CSVから移した値、または利用者がCSV向けに設定した値です。日付を過ぎても自動終了しません。予想側の欠場係数は減衰する場合があります。</p><div class="row"><input id="search" placeholder="選手名を検索" oninput="filterList()"><select id="club" onchange="filterList()"><option value="">全クラブ</option>${clubs.map(x=>`<option>${e(x)}</option>`).join('')}</select><select id="reason" onchange="filterList()"><option value="">全理由</option><option value="injury">負傷</option><option value="card">出場停止</option><option value="病気">病気</option></select><label><input type="checkbox" id="overdue" onchange="filterList()">CSV用見込み日経過</label><label><input type="checkbox" id="review-forecast" onchange="filterList()">見込み日要再評価</label></div><p>${new Set(cases.map(x=>x.team+'|'+x.player)).size}選手 / ${cases.length}案件</p><div class="scroll sheet-scroll" role="region" aria-label="離脱中一覧。列見出しを固定してスクロールできます" tabindex="0"><table id="listtable"><thead><tr>${headings.map(([key,label])=>sortHeader(key,label)).join('')}</tr></thead><tbody id="listbody"></tbody></table></div></section>`}
function filterList(){let q=val('search').replace(/\s/g,''),club=val('club'),reason=val('reason'),over=$('#overdue')?.checked,review=$('#review-forecast')?.checked;let today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}).slice(2).replaceAll('-','/');let out=state.cases.filter(x=>x.status==='open'&&(!q||x.player.replace(/\s/g,'').includes(q))&&(!club||x.team===club)&&(!reason||x.absence_type===reason)&&(!over||x.expected_return_date&&x.expected_return_date<today)&&(!review||x.forecast_review_needed));out.sort(compareCases);$('#listbody').innerHTML=out.map(x=>{let ev=state.evidence.filter(y=>y.case_id===x.id).at(-1),p=state.candidates.filter(y=>y.state==='pending'&&y.case_id===x.id).length;return `<tr><td>${e(x.team)}</td><td><a href="#" onclick="openCase(${x.id});return false">${e(x.player)}</a></td><td>${e(reasonLabel(x.absence_type))}</td><td>${x.diagnosis?`<small>案件の診断欄</small><div class="cell-note" title="${e(x.diagnosis)}">${e(x.diagnosis)}</div>`:""}${x.note?`<small>${x.source_row?"元Excelの記載":"案件メモ"}</small><div class="cell-note" title="${e(x.note)}">${e(x.note)}</div>`:""}${!x.diagnosis&&!x.note?"—":""}</td><td>${e(x.start_date||'不明')}</td><td>${e(x.expected_return_date||'不明')}${x.forecast_review_needed?'<div class="warn">要再評価</div>':''}</td><td>${e(ev?.kind||'—')}</td><td>${p||'—'}</td></tr>`}).join('')||'<tr><td colspan="8">該当なし</td></tr>'}
function candidateCard(x){
 const suggestion=state.candidate_suggestions?.[String(x.id)]||{cases:[],candidates:[]};
 const suggestedIds=new Set(suggestion.cases.map(m=>m.case_id));
 const preferred=suggestion.cases.find(m=>m.status==='open'&&(m.reasons.includes('元記事への直接リンク')||x.kind==='suspension'&&m.absence_type==='card'&&m.reasons.includes('停止コード・対象試合一致')))?.case_id||null;
 const suggested=suggestion.cases.map(m=>`<option value="${m.case_id}" ${m.case_id===(x.case_id||preferred)?'selected':''}>#${m.case_id} ${e(m.team)} ${e(m.player)} (${e(m.reasons.join('・'))})</option>`).join('');
 const others=state.cases.filter(c=>!suggestedIds.has(c.id)).map(c=>`<option value="${c.id}" ${c.id===x.case_id?'selected':''}>#${c.id} ${e(c.team)} ${e(c.player)}</option>`).join('');
 const hints=suggestion.cases.map(m=>`<li>案件 #${m.case_id} ${e(m.team)} ${e(m.player)}：${e(m.reasons.join('、'))}${x.kind==='suspension'?`。既存の開始日 ${e(m.start_date||'不明')}、CSV用の出場可能見込み日 ${e(m.expected_return_date||'不明')}、元メモ ${e(m.note||'なし')}`:''}</li>`).join('');
 const related=suggestion.candidates.map(m=>`<li>記事候補 #${m.candidate_id}（${e(m.state)}）：${e(m.reasons.join('、'))}</li>`).join('');
 const matched=suggestion.cases.find(m=>m.case_id===preferred&&m.reasons.includes('停止コード・対象試合一致'));
 const reasonDefault=matched?`元CSV案件 #${matched.case_id} と停止コード・対象試合日が一致。公式記事: ${x.url}`:'';
 return `<div class="card"><strong>${e(x.player)} · ${e(x.team)}</strong> <span class="pill">${e(x.kind==='suspension'?'出場停止':x.kind)}</span> <span class="pill">${e(x.state==='held'?'保留中':x.state)}</span><p>${x.kind==='suspension'?`出場停止 / 対象試合日原文: ${e(x.start_raw||'不明')} / 完全日付: ${e(x.start_date||'不明')}`:x.kind==='appearance'?`試合出場日: ${e(x.event_date||'不明')}`:`${e(x.diagnosis||'診断不明')} / 受傷日原文: ${e(x.start_raw||'不明')} / 完全日付: ${e(x.start_date||'不明')} / 全治: ${e(x.duration_raw||x.duration_status||'不明')}`}</p><p><a href="${e(x.url)}" target="_blank" rel="noopener">${e(x.title||x.url)}</a> · ${e(x.source)}</p><div class="excerpt">${e(x.excerpt)}</div>${hints||related?`<div class="card"><strong>関連付け候補（未確定）</strong><ul>${hints}${related}</ul></div>`:''}${x.state==='pending'?`<div class="card"><h3>${x.kind==='suspension'?'第1段階：出場停止情報を案件に登録':'保存前の確認'}</h3>${x.kind==='suspension'?'<p class="muted">ここでは出場停止を登録するだけです。対象試合が実施され、処分を消化した後に案件詳細で終了を確認します。</p>':''}<label>採用先 <select id="target-${x.id}" onchange="toggleCandidateForm(${x.id})"><option value="" ${preferred?"":"selected"}>新規案件</option><optgroup label="照合候補">${suggested}</optgroup><optgroup label="その他の案件（手動指定）">${others}</optgroup></select></label><div id="new-fields-${x.id}" class="stack" style="${x.case_id||preferred?'display:none':''}"><label>クラブ <input id="new-team-${x.id}" value="${e(x.team||'')}"></label><label>選手 <input id="new-player-${x.id}" value="${e(x.player||'')}"></label><label>${x.kind==='suspension'?'欠場開始日（CSV用）':'受傷日'}（記事の${x.kind==='suspension'?'対象試合日':'原文'} ${e(x.start_raw||'不明')}） <input type="date" id="new-date-${x.id}" value="${e(x.start_date||'')}"></label><small>${x.kind==='suspension'?'対象試合日は上の記事に表示しています。ここには欠場開始日を、根拠がある場合だけ入力してください。':'記事に年月がない場合は、原記事などで確認して入力してください。'}確認できなければ空欄にし、「日付不明を確認」にチェックします。</small><label><input type="checkbox" id="new-unknown-${x.id}"> 日付不明を確認</label><label>${x.kind==='suspension'?'CSV用の出場可能見込み日':'CSV用の復帰見込み日'}（不明なら空欄） <input id="new-return-${x.id}" placeholder="yy/mm/dd"></label></div><label>採用・日付補記の根拠 <input id="new-reason-${x.id}" value="${e(reasonDefault)}" placeholder="元記事と既存案件が同じ出場停止である根拠"></label><div class="row"><button class="primary" onclick="accept(${x.id})">${x.kind==='suspension'?'出場停止情報を登録':'確認して保存'}</button><button onclick="decision(${x.id},'hold')">保留</button><button onclick="decision(${x.id},'reject')">却下</button></div><small>既存案件を選ぶ場合は、その案件の保存済み日付を変更せず記事の根拠を追加します。</small></div>`:x.state==='held'?`<button onclick="decision(${x.id},'resume')">確認を再開</button>`:''}</div>`
}
function pending(){let a=state.candidates.filter(x=>x.state==='pending'||x.state==='held');return `<section class="panel"><h2>確認待ち ${a.length}件</h2><p class="muted">出場停止は、ここで案件への登録・結び付けを確認します。試合実施と処分消化を確認した後、案件詳細で「出場停止を消化済みにする」を使います。年不明の日付は補完しません。</p><div class="stack">${a.map(candidateCard).join('')||'候補はありません'}</div></section>`}
function toggleCandidateForm(id){let box=$('#new-fields-'+id);if(box)box.style.display=val('target-'+id)?'none':'';let candidate=state.candidates.find(x=>x.id===id),match=state.candidate_suggestions?.[String(id)]?.cases?.find(m=>m.case_id==val('target-'+id)&&m.reasons.includes('停止コード・対象試合一致'));let reason=$('#new-reason-'+id);if(reason&&candidate?.kind==='suspension')reason.value=match?`元CSV案件 #${match.case_id} と停止コード・対象試合日が一致。公式記事: ${candidate.url}`:''}
async function accept(id){
 let x=state.candidates.find(y=>y.id===id),target=val('target-'+id),c=state.cases.find(y=>y.id==target);
 let team=val('new-team-'+id),player=val('new-player-'+id),start_date=val('new-date-'+id),expected_return_date=val('new-return-'+id),reason=val('new-reason-'+id).trim();
 if(!target){
  if(!team||!player)return msg('クラブと選手を入力してください',true);
  if(!start_date&&!$('#new-unknown-'+id)?.checked)return msg((x.kind==='suspension'?'欠場開始日':'受傷日')+'を入力するか、日付不明を確認してください',true);
  if(start_date&&start_date!==x.start_date&&!reason)return msg('日付を補記・変更する根拠を入力してください',true);
  if(expected_return_date&&!/^\d{2}\/\d{2}\/\d{2}$/.test(expected_return_date))return msg('CSV用の見込み日は yy/mm/dd で入力してください',true);
  if(state.candidate_suggestions?.[String(id)]?.cases?.some(m=>m.status==='open'&&m.reasons.includes('元記事への直接リンク'))&&!confirm('直接リンクのある既存案件があります。別の新規案件として採用しますか？'))return;
 }else if(['absence','suspension'].includes(x.kind)&&!reason){msg('採用・日付補記の根拠を入力してください',true);$('#new-reason-'+id)?.focus();return}
 let season=x.kind==='suspension'?x.excerpt?.match(/(20\d{2})\/(\d{2})明治安田/):null;
 await act('decide',{candidate_id:id,action:'accept',case_id:target||null,version:c?.version,team,player,start_date,expected_return_date,reason,note:x.kind==='suspension'?x.excerpt:'',origin_competition_key:season?`regular_${season[1]}_${season[2]}`:'',applies_across_competitions:x.kind==='suspension'?'0':''},x.kind==='suspension'?'出場停止情報を登録しました。処分消化の確認は案件詳細で行います':'候補を採用しました');
}

function listAudit(){
 const all=state.list_entries||[],watch=all.filter(x=>x.watch_reason&&!x.auto_selected&&!x.article_id&&x.review_state==='unreviewed'),zero=all.filter(x=>x.article_id&&x.candidate_count===0&&x.review_state==='unreviewed');
 const row=(x,kind)=>`<tr><td>${e(state.sources.find(v=>v.id===x.source_id)?.name||'')}</td><td><a href="${e(x.article_url)}" target="_blank" rel="noopener">${e(x.title||x.article_url)}</a><br><small>${e(x.watch_reason||'')}</small></td><td>${e(x.last_seen_at||'')}</td><td><button onclick="fetchListed(${x.id})">${x.article_id?'再取得':'本文を取得'}</button><button onclick="excludeListed(${x.id})">対象外</button></td></tr>`;
 return `<section class="panel"><h2>見出し・抽出の確認</h2><p class="muted">収集した一覧ページで見つけた記事見出し ${all.length}件。関連語のある未取得見出し ${watch.length}件、本文取得後に候補を作れなかった記事 ${zero.length}件。記事本文や案件への反映は手動です。</p><h3>関連語のある未取得見出し</h3><div class="scroll"><table><tr><th>情報源</th><th>見出し</th><th>最終発見</th><th>操作</th></tr>${watch.map(x=>row(x,'watch')).join('')||'<tr><td colspan="4">ありません</td></tr>'}</table></div><h3>本文取得後に候補なし</h3><div class="scroll"><table><tr><th>情報源</th><th>見出し</th><th>最終発見</th><th>操作</th></tr>${zero.map(x=>row(x,'zero')).join('')||'<tr><td colspan="4">ありません</td></tr>'}</table></div><details><summary>保存した全見出し ${all.length}件</summary><div class="scroll"><table><tr><th>情報源</th><th>見出し</th><th>状態</th></tr>${all.map(x=>`<tr><td>${e(state.sources.find(v=>v.id===x.source_id)?.name||'')}</td><td><a href="${e(x.article_url)}" target="_blank" rel="noopener">${e(x.title||x.article_url)}</a></td><td>${e(x.review_state==='excluded'?'対象外':x.article_id?`本文取得・候補${x.candidate_count}件`:x.auto_selected?'自動収集対象・未取得':x.watch_reason?'追加確認':'見出し保存')}</td></tr>`).join('')}</table></div></details></section>`
}
async function fetchListed(id){await act('list-entry/fetch',{id},'本文を取得しました。候補を確認してください')}
async function excludeListed(id){let reason=prompt('対象外とする理由','');if(!reason?.trim())return;await act('list-entry/review',{id,state:'excluded',reason},'対象外として記録しました')}
async function fetchArticle(){let url=val('article-url');await act('ingest',{url},'記事を取得しました。候補を確認してください')}
async function runSource(id){let x=await act('source/run',{id},'一覧初頁を取得しました');if(x)msg(x.error||`発見 ${x.found}件、本文取得 ${x.attempted-(x.failed||0)}件、未取得 ${x.skipped||0}件。${x.coverage}`,x.status!=='success')}
async function runArchive(id){let list_url=val('archive-'+id);if(!list_url)return msg('過去一覧を選択してください',true);let x=await act('source/run',{id,list_url},'過去一覧を取得しました');if(x)msg(x.error||`発見 ${x.found}件、本文取得 ${x.attempted-(x.failed||0)}件、未取得 ${x.skipped||0}件。${x.coverage}`,x.status!=='success')}
function csv(){api('preview').then(p=>{preview=p;if(page==='csv')drawCsv()}).catch(err=>msg(err.message,true));return '<section class="panel"><h2>CSV出力</h2><div id="csv-body">プレビューを計算中…</div></section>'}
function drawCsv(){let p=preview;$('#csv-body').innerHTML=`<p>既存10列互換 · 対象 ${p.rows.length}行 / 保留 ${p.holds.length}行 / 未採用候補 ${p.pending.length}件。CSV出力後も予想には未反映です。</p><p class="${p.can_download?'ok':'warn'}">${p.can_download?'全件出力可能':'保留のため完成CSVのダウンロードを停止しています'}</p><button class="primary" ${p.can_download?'':'disabled'} onclick="downloadCsv()">CSVをダウンロード</button><p>暫定出力には形式を確定できた行だけを含めます。除外した保留行と未採用候補は下に表示します。出力行のうち復帰見込みの要再評価は ${p.forecast_review_count}件です。</p><button ${p.can_download_partial?'':'disabled'} onclick="downloadPartialCsv()">暫定10列CSVをダウンロード（${p.rows.length}行）</button><h3>前回出力との差分 ${p.diff.length}件</h3><div class="scroll sheet-scroll"><table><tr><th>種別</th><th>行</th></tr>${p.diff.slice(0,200).map(x=>`<tr><td>${e(x.type)}</td><td>${e(JSON.stringify(x.row))}</td></tr>`).join('')}</table></div><h3>保留理由</h3><div class="scroll sheet-scroll"><table><tr><th>案件</th><th>理由</th></tr>${p.holds.map(x=>`<tr><td>#${x.id} ${e(x.team)} ${e(x.player)}</td><td>${e(x.reason)}</td></tr>`).join('')}</table></div><h3>出力候補</h3><div class="scroll sheet-scroll"><table><tr>${['team','player_name','absence_type','start_date','expected_return_date'].map(x=>`<th>${x}</th>`).join('')}</tr>${p.rows.slice(0,200).map(x=>`<tr>${['team','player_name','absence_type','start_date','expected_return_date'].map(k=>`<td>${e(x[k])}</td>`).join('')}</tr>`).join('')}</table></div>`}
async function downloadPartialCsv(){try{let blob=await api('export-partial');let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='absence-ledger-partial.csv';a.click();URL.revokeObjectURL(u);msg('暫定CSVを出力しました。保留行は含まれません');await refresh()}catch(err){msg(err.message,true)}}
async function downloadCsv(){try{let blob=await api('export');let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='absence-ledger.csv';a.click();URL.revokeObjectURL(u);msg('出力済み。予想への反映は未確認です');await refresh()}catch(err){msg(err.message,true)}}
function migration(){api('migration').then(p=>{if(page==='migration')$('#migration-body').innerHTML=p.error?`<p class="bad">${e(p.error)}: ${e(p.path)}</p>`:`<p>元CSV: ${e(p.path)}<br>データ行 ${p.count}件 / SHA-256 ${e(p.sha256)}<br>状態: ${p.already_imported?'移行済み':'未移行'}</p><details><summary>見出しと先頭3行を確認</summary><pre class="excerpt">${e(JSON.stringify(p.header,null,2))}\n${e(JSON.stringify(p.samples,null,2))}</pre></details><button class="primary" ${p.already_imported?'disabled':''} onclick="act('migrate',{},'元CSVを移行しました')">読み取り移行を実行</button>`}).catch(err=>msg(err.message,true));return `<section class="panel"><h2>既存CSVの読み取り移行</h2><div id="migration-body">確認中…</div></section><section class="panel"><h2>保存とバックアップ</h2><p>SQLite保存先: <code>data/ledger.sqlite3</code>。元Excel・CSVは上書きしません。</p><a href="/api/backup"><button>整合したバックアップをダウンロード</button></a><p class="muted">復元はサーバー停止中にDBを退避し、バックアップを data/ledger.sqlite3 に置き換えます。</p><h3>移行履歴</h3>${state.imports.map(x=>`<p>${e(x.created_at)} · ${x.row_count}行 · ${e(x.sha256)}</p>`).join('')||'なし'}<h3>出力履歴</h3>${state.exports.map(x=>`<p>${e(x.created_at)} · ${x.row_count}行 · ${e(x.sha256)}</p>`).join('')||'なし'}</section>`}
refresh().catch(err=>msg(err.message,true));
</script></html>
